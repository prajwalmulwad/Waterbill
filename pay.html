<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>UPI Payments</title>

<style>
:root {
--bg:#f6f5f1;
--card:#ffffff;
--text:#1d1d1b;
--muted:#6b6a65;
--accent:#0f766e;
--accent-bg:#d9f2ee;
--line:#e4e2db;
}

@media(prefers-color-scheme:dark) {
:root {
--bg:#151514;
--card:#212120;
--text:#f1f0ea;
--muted:#a09f98;
--accent:#5eead4;
--accent-bg:#12403b;
--line:#34332f;
}
}

* {
box-sizing:border-box;
}

body {
margin:0;
padding:20px 16px 40px;
min-height:100vh;
background:var(--bg);
color:var(--text);
font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}

main {
max-width:460px;
margin:auto;
}

h1 {
font-size:24px;
margin:12px 0 5px;
}

.sub {
font-size:14px;
color:var(--muted);
margin-bottom:22px;
}

.amount {
background:var(--accent-bg);
padding:20px;
border-radius:18px;
text-align:center;
margin-bottom:22px;
}

.amount small {
color:var(--muted);
}

.amount strong {
display:block;
font-size:34px;
color:var(--accent);
margin-top:3px;
}

.upi-card {
background:var(--card);
border:1px solid var(--line);
border-radius:16px;
padding:17px;
margin-bottom:13px;
}

.name {
font-size:19px;
font-weight:700;
}

.id {
font-size:13px;
color:var(--muted);
margin-top:6px;
word-break:break-all;
}

.buttons {
display:flex;
gap:9px;
margin-top:15px;
}

button {
flex:1;
padding:13px 8px;
border:0;
border-radius:11px;
font-size:14px;
font-weight:700;
cursor:pointer;
}

.pay {
background:var(--accent);
color:white;
}

.copy {
background:var(--accent-bg);
color:var(--text);
}

.back {
display:block;
width:100%;
margin-top:20px;
padding:15px;
background:var(--card);
color:var(--text);
border:1px solid var(--line);
border-radius:13px;
font-size:15px;
font-weight:600;
text-align:center;
text-decoration:none;
}

.note {
font-size:12px;
color:var(--muted);
line-height:1.6;
margin-top:20px;
}
</style>
</head>

<body>

<main>

<h1>💳 UPI Payments</h1>

<p class="sub">Select a person to make a payment.</p>

<div class="amount">
<small>Payment Amount</small>
<strong>₹50</strong>
</div>

<div id="upiList"></div>

<a href="index.html" class="back">← Back to Home</a>

<p class="note">
Payments are opened through your installed UPI application.
Always verify the recipient's name and amount before confirming.
</p>

</main>

<script>

const AMOUNT = "50.00";

const USERS = [
{
name:"Aditya",
upi:"7204724861@ptaxis"
},
{
name:"Prasad",
upi:"9108637104-4@axl"
},
{
name:"Prajwal",
upi:"mulwadprajwal586-2@okicici"
},
{
name:"John",
upi:"7019682784@nyes"
},
{
name:"Sangamesh",
upi:"8550806015@nyes"
}
];

function payUser(user) {

const params = new URLSearchParams({
pa:user.upi,
pn:user.name,
am:AMOUNT,
cu:"INR",
tn:"Payment"
});

window.location.href = "upi://pay?" + params.toString();

}

async function copyUPI(upi,button) {

try {

await navigator.clipboard.writeText(upi);

button.textContent = "Copied!";

setTimeout(() => {
button.textContent = "Copy UPI ID";
},1500);

} catch(e) {

button.textContent = "Copy unavailable";

}

}

const container = document.getElementById("upiList");

USERS.forEach(user => {

const card = document.createElement("div");
card.className = "upi-card";

const name = document.createElement("div");
name.className = "name";
name.textContent = "👤 " + user.name;

const id = document.createElement("div");
id.className = "id";
id.textContent = user.upi;

const buttons = document.createElement("div");
buttons.className = "buttons";

const pay = document.createElement("button");
pay.className = "pay";
pay.textContent = "Pay ₹50";
pay.onclick = () => payUser(user);

const copy = document.createElement("button");
copy.className = "copy";
copy.textContent = "Copy UPI ID";
copy.onclick = () => copyUPI(user.upi,copy);

buttons.append(pay,copy);
card.append(name,id,buttons);

container.appendChild(card);

});

</script>

</body>
</html>
